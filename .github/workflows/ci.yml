name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feature/app-foundation

jobs:
  validate:
    name: Validate app
    runs-on: ubuntu-latest
    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and API tests
        run: npm run test

      - name: Build
        run: npm run build

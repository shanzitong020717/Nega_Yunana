services:
  - type: web
    name: nega-yunana-realtime-relay
    runtime: node
    buildCommand: npm ci --include=dev
    startCommand: npm run relay:start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://api.bltcy.ai/v1
      - key: OPENAI_REALTIME_MODEL
        value: gpt-4o-realtime-preview
      - key: REALTIME_RELAY_SHARED_SECRET
        sync: false
      - key: REALTIME_RELAY_ALLOWED_ORIGINS
        value: https://nega-yunana.vercel.app

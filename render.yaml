services:
  - type: web
    name: nega-yunana-realtime-relay-oregon
    runtime: node
    region: oregon
    buildCommand: npm ci --include=dev
    startCommand: npm run relay:start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: REALTIME_RELAY_PROVIDER
        value: gemini_live
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_LIVE_MODEL
        value: gemini-3.1-flash-live-preview
      - key: REALTIME_RELAY_SHARED_SECRET
        sync: false
      - key: REALTIME_RELAY_ALLOWED_ORIGINS
        value: https://nega-yunana.vercel.app,http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001
